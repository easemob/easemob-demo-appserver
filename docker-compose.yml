services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: easemob-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: app_server
    ports:
      - "3307:3306"
    volumes:
      # Initialize database with create_tables.sql
      - ./doc/create_tables.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_MIRROR: ${DOCKER_MIRROR:-registry.cn-hangzhou.aliyuncs.com}
    container_name: easemob-app-server
    ports:
      - "8096:8096"
    environment:
      # Activate Docker Profile
      SPRING_PROFILES_ACTIVE: docker
      
      # Application Credentials
      APPLICATION_APPKEY: ${APP_KEY}
      APPLICATION_CLIENTID: ${CLIENT_ID}
      APPLICATION_CLIENTSECRET: ${CLIENT_SECRET}
      APPLICATION_BASEHTTPURI: ${BASE_HTTP_URI:-http://a1.easemob.com}
      APPLICATION_INTRANET_BASE_HTTPS_URI: ${INTRANET_BASE_HTTPS_URI:-https://a1.easemob.com}
      APPLICATION_AGORAAPPID: ${AGORA_APP_ID}
      APPLICATION_AGORACERT: ${AGORA_CERT}
      
      # Database Connection
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/app_server?useSSL=false&autoReconnect=true&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      
      # Redis Connection (using internal service name if we added redis, but user didn't ask for redis container explicitly, however app.properties has redis config. 
      # Assuming user wants a full env, I should probably add redis or use embedded if applicable, but user requirement said "MySQL 8, JRE 21". 
      # Let's check if Redis is strictly required. The app depends on Redis (Jedis, Spring Data Redis). 
      # I MUST add Redis to make it work out of the box.)
      SPRING_REDIS_CHANNEL_NODES: tcp://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: ${REDIS_IMAGE:-redis:latest}
    container_name: easemob-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
